<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feFlood flood-color="#78B3E2" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="#78B3E2">
    <!-- Two crossing pills forming an X -->
    <rect x="12" y="4" width="8" height="24" rx="4" transform="rotate(-35, 16, 16)"/>
    <rect x="12" y="4" width="8" height="24" rx="4" transform="rotate(35, 16, 16)"/>
  </g>
</svg>
