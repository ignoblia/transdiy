<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#78B3E2" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="#78B3E2">
    <!-- Two crossing pills forming an X -->
    <rect x="47" y="15" width="26" height="90" rx="13" transform="rotate(-35, 60, 60)"/>
    <rect x="47" y="15" width="26" height="90" rx="13" transform="rotate(35, 60, 60)"/>
  </g>
</svg>
